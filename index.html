<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
</head>
<body>
    <h1>To-Do List</h1>
    <h3>Enter "list" to show all tasks</h3>
    <h3>Enter "add" to add any task</h3>
    <h3>Enter "delete" to remove any task</h3>
    <h3>Enter "quit" to quit the To-Do</h3>
    <script src="app.js"></script>
</body>
</html>
